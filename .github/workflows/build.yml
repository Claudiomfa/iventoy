name: build
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Nome da imagem (minúsculas)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/iventoy" >> $GITHUB_OUTPUT

      - name: Última versão do iVentoy
        id: ver
        run: |
          V=$(curl -s https://api.github.com/repos/ventoy/PXE/releases/latest | jq -r .tag_name | sed 's/^v//')
          echo "version=$V" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Já existe esta versão?
        id: check
        run: |
          if docker manifest inspect ${{ steps.img.outputs.name }}:${{ steps.ver.outputs.version }} >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.exists == 'false' || github.event_name != 'schedule'
        with:
          context: .
          push: true
          build-args: IVENTOY=${{ steps.ver.outputs.version }}
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ steps.ver.outputs.version }}
